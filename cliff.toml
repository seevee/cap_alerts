# git-cliff configuration — mirrors the companion weather_alerts_card repo so
# both halves of the integration+card pair share one changelog house style.
# Regenerate CHANGELOG.md with: git cliff --config cliff.toml --output CHANGELOG.md

[changelog]
header = """
# Changelog
"""

body = """
{% if version %}
## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% endif -%}
{%- for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits -%}
- {{ commit.message | upper_first }} ({{ commit.id | truncate(length=7) }})
{% endfor -%}
{% endfor %}
"""

[git]
conventional_commits = true
filter_unconventional = true
tag_pattern = "v[0-9]*"

commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^docs", group = "Documentation" },
  # Release bumps here use the scoped form `chore(release):` (CI-committed by
  # .github/workflows/release.yml), so the skip pattern must account for the scope.
  { message = '^chore\(release\)', skip = true },
  # Bare `ci:` commits are build-internal noise; scoped fix(ci)/chore(ci) still
  # land in Fixed/Maintenance because those rules match first.
  { message = "^ci", skip = true },
  { message = "^chore", group = "Maintenance" },
]
