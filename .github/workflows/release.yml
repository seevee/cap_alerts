name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  regenerate-changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.target_commitish }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Regenerate changelog
        run: pip install "$(grep '^git-cliff' requirements_test.txt)" && git cliff --config cliff.toml --tag "${{ github.event.release.tag_name }}" --output CHANGELOG.md
      - name: Commit changelog if changed
        run: |
          if ! git diff --quiet CHANGELOG.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "chore(changelog): regenerate changelog for ${{ github.event.release.tag_name }}"
            git push origin HEAD:${{ github.event.release.target_commitish }}
          fi
