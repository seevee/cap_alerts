name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Validate & publish
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Validate manifest matches tag
        run: |
          TAG="${{ github.ref_name }}"
          MANIFEST_VERSION=$(python -c "import json; print(json.load(open('custom_components/cap_alerts/manifest.json'))['version'])")
          if [ "$MANIFEST_VERSION" != "${TAG#v}" ]; then
            echo "Manifest version ($MANIFEST_VERSION) doesn't match tag ($TAG)"
            exit 1
          fi

      - name: Run tests, lint, typecheck
        run: |
          pip install -r requirements_test.txt
          pytest tests -q
          ruff check custom_components/ tests/
          mypy custom_components/cap_alerts

      - name: Build zip
        run: |
          ZIP="cap_alerts-${{ github.ref_name }}.zip"
          cd custom_components
          zip -r "../$ZIP" cap_alerts
          cd ..

      - uses: softprops/action-gh-release@v2
        with:
          files: "cap_alerts-v*.zip"
          generate_release_notes: false
