name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 1-28/7 * *"

# A new push to a PR cancels that PR's run in progress, since only the head
# commit's checks gate the merge. Everything else, main included, groups by
# commit and never cancels, so each commit on main keeps its own result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    name: HACS & Hassfest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
      - uses: home-assistant/actions/hassfest@master

  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install ruff (pinned)
        run: pip install "$(grep '^ruff==' requirements_test.txt)"
      - run: ruff format --diff custom_components/ tests/ scripts/
      - run: ruff check custom_components/ tests/ scripts/

  typecheck:
    runs-on: ubuntu-latest
    name: Type check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: mypy custom_components/cap_alerts

  test:
    runs-on: ubuntu-latest
    name: Test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      # Coverage source and reporting live in .coveragerc. The floor is a
      # ratchet: raise it as gaps close, never lower it to make a PR pass.
      - run: pytest tests -q --cov --cov-fail-under=96
      # The quality scale asks for 100% here and the flow is now at it, so this
      # gate is a floor and a ceiling both: a new step lands with its tests.
      - name: Config flow coverage
        run: >-
          coverage report
          --include='custom_components/cap_alerts/config_flow.py,custom_components/cap_alerts/flows/*'
          --fail-under=100

  test-floor:
    runs-on: ubuntu-latest
    name: Test (HA floor)
    # The oldest core hacs.json declares, and the test plugin release that pins
    # it. Kept here rather than in a requirements file: Dependabot reads every
    # requirements*.txt in the root as one manifest and drags both
    # homeassistant pins to a single version (#262). Raise these with hacs.json.
    env:
      HA_FLOOR: "2026.4.3"
      PHCC_FLOOR: "0.13.324"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      # hacs.json is what HACS enforces, so the declared floor and the tested
      # one must be the same version.
      - name: Floor matches hacs.json
        run: |
          declared=$(python -c 'import json; print(json.load(open("hacs.json"))["homeassistant"])')
          echo "hacs.json $declared, tested $HA_FLOOR"
          test "$declared" = "$HA_FLOOR"
      # The shared test pins, minus the two this job replaces, pytest-cov (the
      # plugin pins its own) and the lint/type/changelog tools it doesn't run.
      - name: Install the floor
        run: |
          grep -vE '^(homeassistant|pytest-homeassistant-custom-component|pytest-cov|ruff|mypy|types-|git-cliff)' \
            requirements_test.txt > floor.txt
          pip install -r floor.txt \
            "homeassistant==$HA_FLOOR" \
            "pytest-homeassistant-custom-component==$PHCC_FLOOR"
      - run: pytest tests -q
