name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 1-28/7 * *"

jobs:
  validate:
    runs-on: ubuntu-latest
    name: HACS & Hassfest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
      - uses: home-assistant/actions/hassfest@master

  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install ruff (pinned)
        run: pip install "$(grep '^ruff==' requirements_test.txt)"
      - run: ruff format --diff custom_components/ tests/ scripts/
      - run: ruff check custom_components/ tests/ scripts/

  typecheck:
    runs-on: ubuntu-latest
    name: Type check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: mypy custom_components/cap_alerts

  test:
    runs-on: ubuntu-latest
    name: Test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      # Coverage source and reporting live in .coveragerc. The floor is a
      # ratchet: raise it as gaps close, never lower it to make a PR pass.
      - run: pytest tests -q --cov --cov-fail-under=96
      # The quality scale asks for 100% here and the flow is now at it, so this
      # gate is a floor and a ceiling both: a new step lands with its tests.
      - name: Config flow coverage
        run: >-
          coverage report
          --include='custom_components/cap_alerts/config_flow.py'
          --fail-under=100
