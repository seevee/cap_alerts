name: New Provider Request
description: Request support for a new CAP alert source (e.g. BoM, DWD, JMA)
labels: [enhancement, provider]
body:
  - type: checkboxes
    id: coverage
    attributes:
      label: Existing Coverage Check
      description: >-
        Many national services are already reachable without a dedicated
        provider — please check before requesting one.
      options:
        - label: >-
            This source is not covered by the MeteoAlarm provider
            (~37 European services)
          required: true
        - label: >-
            This source is not in the WMO provider's source dropdown
            (SWIC registry, ~100 services worldwide)
          required: true
  - type: input
    id: provider-name
    attributes:
      label: Provider Name
      description: e.g. BoM, DWD, JMA
    validations:
      required: true
  - type: input
    id: region
    attributes:
      label: Region / Country
    validations:
      required: true
  - type: input
    id: feed-url
    attributes:
      label: Feed or API URL
      description: Link to the CAP feed, Atom feed, or JSON API
    validations:
      required: true
  - type: textarea
    id: format
    attributes:
      label: Format & Authentication
      description: Data format (CAP XML, Atom, GeoJSON, etc.) and any auth requirements
  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      description: >-
        Sample payloads, quirks, rate limits, licensing. If the source
        publishes multi-region or multi-language alerts, a sample of that
        shape is especially useful.
