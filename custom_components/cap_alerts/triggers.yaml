# The target every trigger shares. The editor offers a device only when it
# holds an entity matching a filter, and a location's alert sensors exist only
# while its alerts are live, so the alert filter alone hides a quiet location
# (#440). The second filter matches its Last updated sensor, which every entry
# has from setup on and no other cap_alerts sensor matches. Picked as an
# entity it never fires: the events only name alert sensors.
.incident_target: &incident_target
  entity:
    - domain: sensor
      device_class: incident
    - integration: cap_alerts
      domain: sensor
      device_class: timestamp

# One shape for all three: alert sensors as the target, one severity select.
# No `behavior` or `for`: core changed the behavior field between the 2026.4.3
# floor and later releases, and one file can't describe both.
.incident_common: &incident_common
  target: *incident_target
  fields:
    threshold:
      required: true
      default: severe
      selector:
        select:
          translation_key: trigger_threshold
          options:
            - any
            - minor
            - moderate
            - severe
            - extreme

.threshold_field: &threshold_field
  required: true
  default: severe
  selector:
    select:
      translation_key: trigger_threshold
      options:
        - any
        - minor
        - moderate
        - severe
        - extreme

# The timed trigger (#326): a timer on the alert's onset, offset before or
# after, the shape calendar's event_started uses.
.timed_common: &timed_common
  target: *incident_target
  fields:
    threshold: *threshold_field
    offset:
      required: true
      default:
        days: 0
        hours: 0
        minutes: 0
        seconds: 0
      selector:
        duration:
          enable_day: true
    offset_type:
      required: true
      default: before
      selector:
        select:
          translation_key: trigger_offset_type
          options:
            - before
            - after

incident_arrived: *incident_common
incident_updated: *incident_common
incident_escalated: *incident_common
incident_downgraded: *incident_common
incident_ended: *incident_common
incident_started: *timed_common
